<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Flask To-Do</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <h2 class="text-center mb-4">Flask To-Do App</h2>

    <form action="/add" method="POST" class="input-group mb-3">
        <input type="text" name="title" class="form-control" placeholder="Görev gir..." required>
        <button type="submit" class="btn btn-primary">Ekle</button>
    </form>

    <ul class="list-group">
        {% for todo in todo_list %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ todo.title }}
            <a href="/delete/{{ todo.id }}" class="btn btn-danger btn-sm">Sil</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
